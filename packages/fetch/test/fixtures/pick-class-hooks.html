<!doctype html>
<!--
  Hand-written fixture. What it pins for the picker (WP6): the **class filter** in
  `cssPath.ts`, measured on the class names publishers really ship. The items carry
  `item` (a safe hook) and `md:top-0` / `p-[0.3rem]` (Tailwind names that a bare
  `.md:top-0` selector does NOT mean: the CSS engine reads an attribute, a
  pseudo-class, or throws). So the ladder must skip the unsafe names, and land on
  the ancestor-anchored selector — and it must not land on `li`, because the nav is
  `li` too.

  The click: the second card. path = html:1 > body:2 > div:1 > ul:1 > li:2
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example Hooks — Tailwind class names</title>
    <meta name="generator" content="hand-written" />
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/world">World</a></li>
      </ul>
    </nav>
    <div class="wrap">
      <ul class="feed">
        <li class="item md:top-0 p-[0.3rem]"><a href="/t1">Story one with utility classes</a><span class="deck">The deck of the first story.</span></li>
        <li class="item md:top-0 p-[0.3rem]"><a href="/t2">Story two with utility classes</a><span class="deck">The deck of the second story.</span></li>
        <li class="item md:top-0 p-[0.3rem]"><a href="/t3">Story three with utility classes</a><span class="deck">The deck of the third story.</span></li>
      </ul>
    </div>
  </body>
</html>
