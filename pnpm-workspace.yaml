# =============================================================================
# newspa workspace
#
# pnpm 12 reads ONLY auth / registry / TLS / proxy settings from `.npmrc`.
# Everything else lives here, in camelCase. See docs/tooling.md for the
# npm -> pnpm translation table and the reasoning behind each rule.
# =============================================================================

packages:
  - "apps/*"
  - "packages/*"

# -----------------------------------------------------------------------------
# Supply-chain rules (translated from the user's npm .npmrc)
# -----------------------------------------------------------------------------

# npm: save-exact=true
# Every range in this repo is an exact version — no carets, no wildcards, no
# `latest`. The catalog below is the only place a version number is written.
saveExact: true

# npm: min-release-age=2  (npm's unit is DAYS)
# pnpm's unit is MINUTES, so 2 days = 2880. Writing `2` here would mean
# "2 minutes" and silently disable the whole rule.
minimumReleaseAge: 2880

# Explicitly configured => strict is the default, stated anyway so the intent
# survives copy-paste. A version younger than the gate fails resolution loudly
# instead of installing quietly.
minimumReleaseAgeStrict: true

# No package is exempt: this project has no private scope and no self-published
# packages. Empty list kept in file to make the policy explicit.
minimumReleaseAgeExclude: []

# npm: ignore-scripts=true
# No dependency may execute install scripts. Our dependency set is 0 scripts,
# so this is a free policy, not a compatibility risk.
ignoreScripts: true

# pnpm's stronger, per-package form of the same idea: every unreviewed build
# script fails the install. `allowBuilds` stays empty on purpose — adding an
# entry is a deliberate, reviewable decision.
strictDepBuilds: true
allowBuilds: {}

# Refuse transitive deps resolved from git/tarball URLs.
blockExoticSubdeps: true

# `pnpm start` self-heals a stale node_modules instead of crashing on import.
# This is what makes "start it yourself" survivable after a `git pull`.
verifyDepsBeforeRun: install

# -----------------------------------------------------------------------------
# Workspace ergonomics
# -----------------------------------------------------------------------------

# pnpm's spelling of npm's engine-strict, which .npmrc can no longer carry.
engineStrict: true

# Do not run pre/post hooks around our own scripts; `pnpm build` is one command.
enablePrePostScripts: false

strictPeerDependencies: false
autoInstallPeers: true

linkWorkspacePackages: true
preferWorkspacePackages: true

# Workspace deps are written as `workspace:*` (exact, rolling resolution).
saveWorkspaceProtocol: rolling

# Single lockfile for the workspace: one resolution for core/config/db/fetch/paper/server/web.
sharedWorkspaceLockfile: true

# Versions: one place. packages/* reference these with the `catalog:` protocol.
#
# EXACT versions, because `save-exact` is a hard rule here. Consequence, stated
# so it is not a surprise: an exact pin is a snapshot of "old enough, clean
# audit, works", so advancing is an explicit `pnpm update` (which re-checks the
# age gate), never an accident of `install` picking up a new release.
# `pnpm outdated` shows what moved.
catalog:
  # TypeScript 7 (the native compiler): a full typecheck of this workspace is
  # seconds, and the LSP is the reason to keep it. It is only ever the checker —
  # Node 26 strips the types at runtime. No tool here needs the JS compiler:
  # formatting and linting are Biome's job.
  typescript: 7.0.2
  "@types/node": 26.6.6
  "@biomejs/biome": 2.6.6
  zod: 4.6.7
  cheerio: 1.2.0
  fast-xml-parser: 5.12.0
  playwright-core: 1.65.0
  react: 19.3.1
  react-dom: 19.3.1
  react-router: 8.5.1
  # i18n. These are the newest releases that clear the 2-day age gate at pin
  # time: i18next 27.0.1 (2026-11-07) and react-i18next 18.0.1 (2026-11-08) were
  # younger than minimumReleaseAge when pinned, and the gate is the point.
  # react-i18next 17's peer range (>=26.2.0) accepts i18next 27.
  i18next: 27.0.0
  react-i18next: 17.1.13
  "@tanstack/react-query": 5.107.0
  vite: 8.3.6
  "@vitejs/plugin-react": 6.2.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # Test-only React rendering. `@testing-library/dom` is a peer of the React
  # bindings, so it is declared rather than auto-installed unnamed.
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.2
  vitest: 5.1.0
  # Git hooks. 9.1.7 (2024-11-18) is the newest release; the age gate is trivially
  # met. Chosen because it ships **no install scripts and no dependencies** - so
  # `ignoreScripts: true` and `strictDepBuilds: true` above stay intact, and the
  # hook is a file in git, reviewed like code, not a binary in a hook path.
  husky: 9.1.7
  "@vitest/coverage-v8": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  happy-dom: 21.0.4
  playwright: 1.65.0

catalogMode: prefer
